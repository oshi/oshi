# Compares every FFM FunctionDescriptor in oshi-core-ffm against the platform SDK's real prototype.
# Catches the parameter- and return-width mismatches that otherwise surface as an intermittent
# crash rather than a test failure. Fork-side diagnostic; not part of the release gate.
name: FFM signature audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ffm-audit/**'
      - '.github/workflows/ffm-audit.yaml'
      - 'oshi-core-ffm/src/main/java/oshi/ffm/**'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit macOS bindings
        run: |
          python3 .github/ffm-audit/audit.py --platform mac --toolchain clang \
            --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/mac/**/*.java" \
            --workdir "${RUNNER_TEMP}/ffm-audit" \
            --cflags "-isysroot $(xcrun --show-sdk-path)"
      - name: Upload the generated sources and compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffm-audit-mac
          path: ${{ runner.temp }}/ffm-audit
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the headers the bindings need
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libudev-dev libsystemd-dev
      - name: Audit Linux bindings
        run: |
          python3 .github/ffm-audit/audit.py --platform linux --toolchain gcc \
            --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/linux/**/*.java" \
            --workdir "${RUNNER_TEMP}/ffm-audit"
      - name: Upload the generated sources and compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffm-audit-linux
          path: ${{ runner.temp }}/ffm-audit
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit Windows bindings
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          python .github\ffm-audit\audit.py --platform windows --toolchain msvc ^
            --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/windows/**/*.java" ^
            --workdir "%RUNNER_TEMP%\ffm-audit" --cflags "/permissive-"
      - name: Upload the generated sources and compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffm-audit-windows
          path: ${{ runner.temp }}/ffm-audit
          if-no-files-found: warn

  # The Unix variants have far less struct surface than the three platforms above -- FreeBSD 2
  # layouts, OpenBSD 1, Solaris 4, and the two in the shared oshi.ffm.platform.unix package -- but
  # they are the layouts nobody can eyeball, so they are exactly the ones worth compiling.
  #
  # These VMs need no JDK: the audit is python plus the base system's compiler and headers.
  #
  # AIX and DragonFly BSD are audited by hand on the GCC compile farm instead. Neither declares a
  # struct layout of its own, and neither has a VM image here.
  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Audit FreeBSD bindings
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          disable-cache: true
          usesh: true
          copyback: true
          prepare: |
            pkg install -y python3
          run: |
            python3 .github/ffm-audit/audit.py --platform freebsd --toolchain clang \
              --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/unix/freebsd/**/*.java" \
              --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/unix/*.java" \
              --workdir ffm-audit-work
      - name: Upload the generated sources and compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffm-audit-freebsd
          path: ffm-audit-work
          if-no-files-found: warn

  openbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Audit OpenBSD bindings
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1
        with:
          release: "7.9"
          usesh: false
          mem: 2048
          copyback: true
          cache-after-prepare: true
          prepare: |
            pkg_add python%3
          run: |
            python3 .github/ffm-audit/audit.py --platform openbsd --toolchain clang \
              --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/unix/openbsd/**/*.java" \
              --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/unix/*.java" \
              --workdir ffm-audit-work
      - name: Upload the generated sources and compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffm-audit-openbsd
          path: ffm-audit-work
          if-no-files-found: warn

  solaris:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Audit Solaris bindings
        uses: vmactions/openindiana-vm@52f16d4534fe3edd9d9621621c238398d4d2a698 # v1
        with:
          mem: 4096
          cpu: 2
          disable-cache: true
          copyback: true
          prepare: |
            pkg install gcc-14 || true
          run: |
            PATH=/usr/gcc/14/bin:$PATH
            export PATH
            python3 .github/ffm-audit/audit.py --platform solaris --toolchain gcc \
              --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/unix/solaris/**/*.java" \
              --sources "oshi-core-ffm/src/main/java/oshi/ffm/platform/unix/*.java" \
              --workdir ffm-audit-work
      - name: Upload the generated sources and compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffm-audit-solaris
          path: ffm-audit-work
          if-no-files-found: warn
