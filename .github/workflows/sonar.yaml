name: SonarCloud

on:
  workflow_dispatch:
    inputs:
      branch:
        description: >-
          SonarCloud branch to report under. Set this when dispatching against a feature branch, so the analysis
          lands on its own branch instead of overwriting master's. Leave empty for a master run.
        required: false
        default: ""
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'

permissions:
  contents: read

jobs:
  build:
    if: github.repository_owner == 'oshi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          cache: maven
          distribution: temurin
          java-version: 25
      - name: Set SONAR_SCANNER_JAVA_OPTS
        run: echo "SONAR_SCANNER_JAVA_OPTS=-Xmx512m" >> $GITHUB_ENV
      - name: Analyze with SonarCloud
        # sonar-maven-plugin reads SONAR_TOKEN from the env, so it does not
        # need to appear on the command line (and shouldn't, to keep it out
        # of process argv).
        # SONAR_BRANCH is read from the environment rather than interpolated into the script, so a dispatch
        # input cannot inject shell.
        run: |
          if [ -n "${SONAR_BRANCH}" ]; then
            set -- -D"sonar.branch.name=${SONAR_BRANCH}"
          fi
          ./mvnw verify sonar:sonar -B -D"sonar.projectKey=oshi_oshi" -D"sonar.organization=oshi-oshi" -D"sonar.host.url=https://sonarcloud.io" "$@"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BRANCH: ${{ inputs.branch }}
