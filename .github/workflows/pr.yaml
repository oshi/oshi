# Limited CI matrix on all pull requests to any branch
name: Pull Request CI

on:
  pull_request:
    # `labeled` lets the `full-coverage` label trigger a run immediately (no re-push);
    # the other types are the default set.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'

# Deny-all default so any job without an explicit block gets no token permissions;
# each job below grants exactly what it needs (least privilege, see Sonar S8264).
permissions: {}

jobs:
  # Detect whether this PR touches Unix-platform code or the build infrastructure.
  # The nested-VM Unix coverage jobs (freebsd/netbsd/openbsd/dragonflybsd/openindiana) are gated on this
  # so an unrelated PR doesn't spin up slow VMs. Generic shared source is covered by
  # the always-on ubuntu/mac/windows jobs, Codecov carryforward, and the authoritative
  # master run. A `full-coverage` label overrides the gate to force the VM jobs on; the same label
  # starts an AppVeyor build, which is path-filtered in the same spirit (see appveyor-dispatch.yaml).
  changes:
    # On a `labeled` event only proceed for the full-coverage label, so adding an
    # unrelated label doesn't re-run CI. opened/synchronize/reopened always run.
    # The VM jobs inherit this via `needs: changes`.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unix: ${{ steps.filter.outputs.unix }}
    steps:
      # Skip the Unix VM jobs only when EVERY changed file is provably irrelevant to them: another
      # platform's implementation tree, documentation, or CI configuration. Anything else runs them,
      # including shared code and paths that do not exist yet.
      #
      # The include list this replaces looked for a `unix/` path segment plus the build inputs, which
      # missed everything Unix depends on without saying "unix" in its path: oshi.properties carries
      # the filesystem exclude lists for AIX, FreeBSD, DragonFly, OpenBSD and Solaris, and every Unix
      # driver calls shared code such as ParseUtil. PR #3727 changed oshi.properties and all six Unix
      # jobs reported "skipping".
      #
      # predicate-quantifier: some-with-excludes makes a file count when it matches at least one
      # pattern and no negated one, so `**` minus the exclusions below is the whole rule, and the
      # filter is true when at least one changed file survives it. No checkout is needed: on a
      # pull_request event the action reads the file list from the API, which is what
      # `pull-requests: read` above is for.
      - name: Detect Unix-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            unix:
              - '**'
              - '!**/*.md'
              - '!.github/**'
              - '!.circleci/**'
              - '!src/site/**'
              - '!**/mac/**'
              - '!**/windows/**'

  # Static analysis, split into parallel jobs so no single job's sequential Maven
  # invocations dominate the critical path.

  # Formatting and style — the fastest of the static-analysis jobs.
  lint-format:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ubuntu-latest
    name: Lint (Spotless, Checkstyle)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
          # Restore master's caches but never save: a PR's caches are invisible to other PRs, so every
          # copy it saves (the Maven repository, and since setup-java v6 the JDK as well) is never reused.
          cache-read-only: true
      - name: Install
        run: ./mvnw install -DskipTests -q
      - name: Spotless
        run: ./mvnw spotless:check
      - name: Checkstyle
        run: ./mvnw checkstyle:check

  # API restrictions, javadoc, and SLF4J compatibility.
  # Runs on ubuntu/JDK 25 (javadoc for oshi-core-ffm requires JDK 25).
  lint-verify:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ubuntu-latest
    name: Lint (ForbiddenAPIs, Javadoc, SLF4J)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
          cache-read-only: true
      - name: Install (release profile, catches javadoc-jar errors javadoc:javadoc misses)
        # -Prelease exercises the same attach-javadocs execution used at release:perform time,
        # which RELEASING.md notes is stricter than the javadoc:javadoc report goal below about
        # unresolved {@link} references. -Dgpg.skip=true skips only the release profile's signing
        # step (no key is configured here); its source-jar attachment is harmless.
        run: ./mvnw -Prelease install -DskipTests -Dgpg.skip=true -q
      - name: Forbidden APIs
        run: ./mvnw forbiddenapis:check forbiddenapis:testCheck
      - name: Verify SLF4J 1.7 API compatibility
        run: ./mvnw -Pverify-slf4j-17 clean compile

  # Error Prone, including NullAway, which enforces the JSpecify nullability annotations over
  # @NullMarked packages only. ERROR-severity findings block the PR (javac's own default
  # behavior); WARNING-severity findings don't, and accumulate for ongoing triage. NullAway is
  # ERROR, so a nullability violation fails here. -DskipTests skips test execution but not test
  # compilation, so test sources are analyzed too.
  error-prone:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ubuntu-latest
    name: Error Prone
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
          cache-read-only: true
      - name: Error Prone
        run: ./mvnw install -DskipTests -Perror-prone

  test:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # Latest LTS (JDK 25) across all three OSes — the row that uploads the
      # linux/macos/windows coverage flags and runs the JNA/FFM comparison tests.
      # The version floor/ceiling checks (JDK 21 and 26) run on ubuntu only; an
      # OS-specific bug that is also JDK-version-specific in a way ubuntu wouldn't
      # catch is vanishingly rare.
      matrix:
        include:
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
            coverage-flag: linux
          - os: ubuntu-latest
            java: 26
          - os: macos-latest
            java: 25
            coverage-flag: macos
          - os: windows-latest
            java: 25
            coverage-flag: windows
      fail-fast: false
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
          cache-read-only: true
      - name: Test with Maven
        if: ${{ !contains(matrix.java, '25') }}
        run: ./mvnw test -B
      - name: Test with Maven (Compare JNA/FFM and aggregate coverage)
        if: contains(matrix.java, '25')
        run: ./mvnw test -Paggregate-coverage -B
      - name: Upload Coverage
        if: always() && contains(matrix.java, '25')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml
          flags: ${{ matrix.coverage-flag }}
      # Codecov Test Analytics: a failed test's name and stack trace land in the PR comment. Every
      # matrix row uploads, not just the coverage rows. The junit-platform plugin writes one legacy
      # JUnit XML per module; they are listed rather than searched for because Codecov's default
      # search does not match the file name. A module that did not build on this JDK, or that the
      # run never reached, has no file, and that is only a warning.
      - name: PROBE turn CDATA failure bodies into escaped text
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'PYEOF'
          import glob, html, re
          for f in glob.glob('*/target/junit-platform/TEST-junit-jupiter.xml'):
              s = open(f, encoding='utf-8', newline='').read()
              s = re.sub(r'(<(failure|error)\b[^>]*>)<!\[CDATA\[(.*?)\]\]>(</\2>)',
                         lambda m: m[1] + html.escape(m[3], quote=False) + m[4], s, flags=re.S)
              open(f, 'w', encoding='utf-8', newline='').write(s)
          PYEOF
          grep -h -A3 '<failure' */target/junit-platform/TEST-junit-jupiter.xml || true
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          disable_search: true
          # The action splits this on commas alone, so no whitespace may survive between entries:
          # each trailing backslash joins the next line on with nothing in between.
          files: "oshi-common/target/junit-platform/TEST-junit-jupiter.xml,\
            oshi-core/target/junit-platform/TEST-junit-jupiter.xml,\
            oshi-core-ffm/target/junit-platform/TEST-junit-jupiter.xml,\
            oshi-metrics/target/junit-platform/TEST-junit-jupiter.xml,\
            oshi-benchmark/target/junit-platform/TEST-junit-jupiter.xml"
          flags: ${{ matrix.coverage-flag }}

