# Limited CI matrix on all pull requests to any branch
name: Pull Request CI

on:
  pull_request:
    # `labeled` lets the `full-coverage` label trigger a run immediately (no re-push);
    # the other types are the default set.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'

# Deny-all default so any job without an explicit block gets no token permissions;
# each job below grants exactly what it needs (least privilege, see Sonar S8264).
permissions: {}

jobs:
  # Detect whether this PR touches Unix-platform code or the build infrastructure.
  # The nested-VM Unix coverage jobs (freebsd/openbsd/openindiana) are gated on this
  # so an unrelated PR doesn't spin up slow VMs. Generic shared source is covered by
  # the always-on ubuntu/mac/windows jobs, Codecov carryforward, and the authoritative
  # master run. A `full-coverage` label overrides the gate to force the VM jobs on; the same label
  # starts an AppVeyor build, which is path-filtered in the same spirit (see appveyor-dispatch.yaml).
  changes:
    # On a `labeled` event only proceed for the full-coverage label, so adding an
    # unrelated label doesn't re-run CI. opened/synchronize/reopened always run.
    # The VM jobs inherit this via `needs: changes`.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unix: ${{ steps.filter.outputs.unix }}
    steps:
      - name: Detect Unix-relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! CHANGED=$(gh pr view "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --json files --jq '.files[].path'); then
            # Fail safe: if the file list can't be read, run the Unix jobs rather than
            # silently skip them and drop coverage.
            echo "Could not read changed files; defaulting to running the Unix jobs"
            echo "unix=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$CHANGED"
          # Skip the Unix VM jobs only when EVERY changed file is provably irrelevant to them:
          # another platform's implementation tree, documentation, or CI configuration. Anything
          # else runs them, including shared code and paths that do not exist yet.
          #
          # The include list this replaces looked for a `unix/` path segment plus the build inputs,
          # which missed everything Unix depends on without saying "unix" in its path: oshi.properties
          # carries the filesystem exclude lists for AIX, FreeBSD, DragonFly, OpenBSD and Solaris, and
          # every Unix driver calls shared code such as ParseUtil. PR #3727 changed oshi.properties
          # and all six Unix jobs reported "skipping".
          #
          # grep -v prints the lines that do NOT match, so a non-empty result means something
          # relevant changed. The jobs still report as skipped rather than vanishing, which is what
          # keeps a skip visible on the pull request.
          #
          # `grep -v ... | grep -q .` rather than `grep -qv ...`: BSD grep ignores -v when setting
          # -q's exit status, so the single-command form is correct on the GNU grep this runner has
          # and silently inverted for anyone testing it on macOS.
          if echo "$CHANGED" | grep -vE '\.md$|(^|/)(mac|windows)/|^\.github/|^\.circleci/|^appveyor\.yml$|^src/site/' | grep -q .; then
            echo "unix=true" >> "$GITHUB_OUTPUT"
          else
            echo "unix=false" >> "$GITHUB_OUTPUT"
          fi

  # Static analysis, split into parallel jobs so no single job's sequential Maven
  # invocations dominate the critical path.

  # Formatting and style — the fastest of the static-analysis jobs.
  lint-format:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ubuntu-latest
    name: Lint (Spotless, Checkstyle)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: 25
          distribution: 'zulu'
          cache: 'maven'
      - name: Install
        run: ./mvnw install -DskipTests -q
      - name: Spotless
        run: ./mvnw spotless:check
      - name: Checkstyle
        run: ./mvnw checkstyle:check

  # API restrictions, javadoc, and SLF4J compatibility.
  # Runs on ubuntu/JDK 25 (javadoc for oshi-core-ffm requires JDK 25).
  lint-verify:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ubuntu-latest
    name: Lint (ForbiddenAPIs, Javadoc, SLF4J)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: 25
          distribution: 'zulu'
          cache: 'maven'
      - name: Install (release profile, catches javadoc-jar errors javadoc:javadoc misses)
        # -Prelease exercises the same attach-javadocs execution used at release:perform time,
        # which RELEASING.md notes is stricter than the javadoc:javadoc report goal below about
        # unresolved {@link} references. -Dgpg.skip=true skips only the release profile's signing
        # step (no key is configured here); its source-jar attachment is harmless.
        run: ./mvnw -Prelease install -DskipTests -Dgpg.skip=true -q
      - name: Forbidden APIs
        run: ./mvnw forbiddenapis:check forbiddenapis:testCheck
      - name: Verify SLF4J 1.7 API compatibility
        run: ./mvnw -Pverify-slf4j-17 clean compile

  # Error Prone, including NullAway, which enforces the JSpecify nullability annotations over
  # @NullMarked packages only. ERROR-severity findings block the PR (javac's own default
  # behavior); WARNING-severity findings don't, and accumulate for ongoing triage. NullAway is
  # ERROR, so a nullability violation fails here. -DskipTests skips test execution but not test
  # compilation, so test sources are analyzed too.
  error-prone:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ubuntu-latest
    name: Error Prone
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: 25
          distribution: 'zulu'
          cache: 'maven'
      - name: Error Prone
        run: ./mvnw install -DskipTests -Perror-prone

  test:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-coverage'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # Latest LTS (JDK 25) across all three OSes — the row that uploads the
      # linux/macos/windows coverage flags and runs the JNA/FFM comparison tests.
      # The version floor/ceiling checks (JDK 21 and 26) run on ubuntu only; an
      # OS-specific bug that is also JDK-version-specific in a way ubuntu wouldn't
      # catch is vanishingly rare.
      matrix:
        include:
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
            coverage-flag: linux
          - os: ubuntu-latest
            java: 26
          - os: macos-latest
            java: 25
            coverage-flag: macos
          - os: windows-latest
            java: 25
            coverage-flag: windows
      fail-fast: false
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: 'maven'
      - name: Test with Maven
        if: ${{ !contains(matrix.java, '25') }}
        run: ./mvnw test -B
      - name: Test with Maven (Compare JNA/FFM and aggregate coverage)
        if: contains(matrix.java, '25')
        run: ./mvnw test -Paggregate-coverage -B
      - name: Upload Coverage
        if: always() && contains(matrix.java, '25')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml
          flags: ${{ matrix.coverage-flag }}

  # FreeBSD VM, JDK 25. Separate from the main matrix because vmactions/freebsd-vm
  # runs inside a nested VM on ubuntu-latest. Aggregate coverage is uploaded to
  # Codecov under the `freebsd` flag — this is the only PR job that exercises
  # the FreeBSD-specific classes.
  testfreebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Test JDK 25, FreeBSD
    needs: changes
    permissions:
      contents: read
    if: >-
      needs.changes.outputs.unix == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'full-coverage')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test in FreeBSD with aggregate coverage
        id: test-freebsd
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          # Caching the base image is a slower copy of a download that happens anyway: restoring
          # it measured 54s against 48s to fetch from source, and a miss also uploads ~970 MB.
          # Only prepared images earn their space, by skipping work rather than moving bytes.
          disable-cache: true
          usesh: true
          copyback: true
          prepare: |
            pkg install -y curl
            pkg install -y openjdk25
          run: |
            export JAVA_HOME=/usr/local/openjdk25
            export PATH=$JAVA_HOME/bin:$PATH
            ./mvnw test -Paggregate-coverage -B
      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml
          flags: freebsd

  # OpenBSD VM, JDK 25. Same pattern as FreeBSD above.
  testopenbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Test JDK 25, OpenBSD
    needs: changes
    permissions:
      contents: read
    if: >-
      needs.changes.outputs.unix == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'full-coverage')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test on OpenBSD with aggregate coverage
        id: test-openbsd
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1
        with:
          release: "7.9"
          usesh: false
          mem: 2048
          copyback: true
          # Skips pkg_add on later runs. This mirror has shown the widest download variance in
          # the matrix, measured at 1.6, 10.0 and 11.2 minutes across three runs.
          cache-after-prepare: true
          prepare: |
            pkg_add curl
            pkg_add jdk%25
          run: |
            # The packaged mvn found its own JVM; the wrapper needs to be told. Glob the version
            # so a jdk package bump doesn't silently break this.
            export JAVA_HOME=$(ls -d /usr/local/jdk-* | tail -1)
            export PATH=$JAVA_HOME/bin:$PATH
            java -version
            ./mvnw test -Paggregate-coverage -B
      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml
          flags: openbsd

  # OpenIndiana (illumos/Solaris) VM, JDK 25. Same pattern as FreeBSD/OpenBSD above, plus the
  # libumem preload that keeps illumos malloc off the break -- see the run: script below.
  testopenindiana:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Test JDK 25, OpenIndiana
    needs: changes
    permissions:
      contents: read
    if: >-
      needs.changes.outputs.unix == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'full-coverage')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test on OpenIndiana with aggregate coverage
        id: test-openindiana
        uses: vmactions/openindiana-vm@21e57a45fc8dbfc8b20804ba707c1dad6c271b4f # v1
        with:
          # Sizing only, matching unix.yaml: the guest peaks at 1.5 GiB across a full test run, and
          # 12288 left only ~4 GB of the runner's 16 GB for the host, QEMU, and the runner agent.
          mem: 8192
          # Two of the runner's four cores, which is what the parallelism caps below assume.
          cpu: 2
          copyback: true
          # Deliberately uncached: this is the largest image in the matrix and the Actions cache is
          # one 10 GB pool shared repo-wide. See unix.yaml for the measurements.
          disable-cache: true
          prepare: |
            pkg install openjdk25
          run: |
            export JAVA_HOME=/usr/jdk/openjdk25
            export PATH=$JAVA_HOME/bin:$PATH
            # Fixes the intermittent "Native memory allocation (malloc) failed" crashes: illumos
            # libc malloc grows the break, and the JVM randomly reserves the compressed class space
            # somewhere in the low 3 GB -- capping the C heap at wherever it landed. libumem's mmap
            # backend never touches the break. See unix.yaml for the full mechanism; backend=mmap is
            # the load-bearing half, since libumem's own default heap source is sbrk.
            export LD_PRELOAD_64=libumem.so.1
            export UMEM_OPTIONS=backend=mmap
            # A green run cannot confirm the preload, and silently losing it would just restore the
            # old failure rate. LD_PRELOAD_64 is inherited, so this covers the forked test JVMs too.
            if LD_DEBUG=files java -version 2>&1 | grep -q libumem; then
              echo "libumem preloaded, ${UMEM_OPTIONS}"
            else
              echo "ERROR: libumem was not preloaded; the malloc fix is not in effect"
              exit 1
            fi
            # _JAVA_OPTIONS reaches the Maven JVM and the forked test JVMs alike.
            export _JAVA_OPTIONS="-Xmx1g"
            # OpenIndiana-only: same parallelism cap as unix.yaml, holding test concurrency to one
            # on a two-core guest.
            #
            # The `if` form rather than `cmd; rc=$?` so this stays correct whether or not the
            # harness runs this script under `set -e`.
            if ./mvnw clean test -Paggregate-coverage -B -Dmaven.gitcommitid.skip=true \
                -Djunit.parallel.executor-service=FORK_JOIN_POOL \
                -Djunit.parallel.strategy=fixed \
                -Djunit.parallel.fixed.parallelism=1 \
                -Djunit.parallel.fixed.max-pool-size=2; then
              MVN_RC=0
            else
              MVN_RC=$?
            fi
            if [ "$MVN_RC" -ne 0 ]; then
              # Read any crash dump inside the guest: a nonzero exit here stops `copyback`, so the
              # guest filesystem is discarded before a later step could upload the file.
              echo "===== swap -s ====="; swap -s || true
              find . -name 'hs_err_pid*.log' -type f | while read -r f; do
                echo "===== $f ====="; cat "$f"
              done
            fi
            exit $MVN_RC
      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml
          flags: solaris
