# Security queries only. The code-quality half of CodeQL runs separately, from GitHub's managed
# default setup ("Code Quality" in the Actions list), so the two rule sets do not overlap.
name: "CodeQL Security"

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'
  schedule:
    - cron: '16 14 * * 1'
  # Workflow changes are in paths-ignore above, so a PR that only edits this file never runs.
  # Dispatch it on the branch to verify such a change before merging.
  workflow_dispatch:

# Default-deny at the workflow level; each job re-grants only what it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # Pin the toolchain to 25 so the java25 profile activates. Java extraction is build-traced:
    # whatever Maven does not compile is not scanned, so on a lower JDK the [25,) modules are
    # invisible to CodeQL rather than merely skipped.
    - name: Setup Java
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        java-version: 25
        distribution: 'zulu'
        cache: 'maven'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    # Autobuild is deliberately not used here. Its Java version heuristic reads the literal
    # maven.compiler.release in each pom and takes the highest; oshi-core-ffm sets the property
    # ${oshi.ffm.release} instead, which the heuristic cannot resolve, so it settled on the 17 from
    # oshi-metrics, overrode JAVA_HOME to a 17 toolchain, and built a five-module reactor. That
    # silently excluded oshi-core-ffm, oshi-benchmark, and oshi-dist from every scan. An explicit
    # build keeps the reactor under our control.
    - name: Build
      run: ./mvnw -B -DskipTests clean compile

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
