# Manual JMH benchmark capture across every platform OSHI runs JMH on.
#
# Runs only on workflow_dispatch so it doesn't burn CI time on every push/PR.
# Intended for occasional re-capture of the numbers reported in PERFORMANCE.md
# (e.g. when adding a new platform or making a perf-relevant change).
#
# Nothing is built: every job runs the published oshi-benchmark uber-jar (7.8.1
# or later) from Maven Central, or a snapshot of master from the Central
# snapshot repository, so the numbers come from the same jar users run.
#
# Native runners (Linux/macOS/Windows) produce stable numbers; FreeBSD, NetBSD,
# OpenBSD and OpenIndiana all run inside a nested QEMU VM on an Ubuntu runner,
# so absolute numbers are noisier and only the relative JNA-vs-FFM comparison
# within a single run is meaningful. illumos is especially fragile under
# back-to-back JMH JVM forks (native malloc pool), so its VM mem is bumped.
#
# The benchmark classes pass --enable-native-access=ALL-UNNAMED to each JMH
# fork through @Fork(jvmArgsPrepend), so only the non-JMH footprint report
# needs it on the command line.
name: Benchmarks (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'oshi-benchmark version: latest, a release (7.8.1 or later), or a snapshot such as 7.8.2-SNAPSHOT'
        required: true
        default: 'latest'
      platforms:
        description: 'all, or a comma-separated list of: linux, macos, windows, freebsd, openbsd, netbsd, aix, openindiana'
        required: true
        default: 'all'
      benchmarks:
        description: 'Regex selecting the benchmarks to run (blank runs them all), e.g. CpuTicksBenchmark'
        required: false
        default: ''
      native-args:
        description: 'JMH options on the Linux, macOS and Windows runners, split on spaces (quotes are not interpreted)'
        required: true
        default: '-wi 5 -i 10 -f 3 -prof gc'
      vm-args:
        description: 'JMH options on the BSD, AIX and OpenIndiana jobs, split on spaces (quotes are not interpreted)'
        required: true
        default: '-wi 1 -i 3 -f 1'

# Default-deny: no job checks out the repository or writes anything.
permissions: {}

env:
  BENCHMARKS: ${{ inputs.benchmarks }}

jobs:
  resolve:
    name: Resolve benchmark jar
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.resolve.outputs.url }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and check the jar
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          RELEASES=https://repo1.maven.org/maven2/com/github/oshi/oshi-benchmark
          SNAPSHOTS=https://central.sonatype.com/repository/maven-snapshots/com/github/oshi/oshi-benchmark
          if [ "$VERSION" = latest ]; then
            VERSION=$(curl -fsSL "$RELEASES/maven-metadata.xml" | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          fi
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$'; then
            # A snapshot's jar is named for its timestamped build, listed in the version's metadata
            BUILD=$(curl -fsSL "$SNAPSHOTS/$VERSION/maven-metadata.xml" \
              | sed -n '/<extension>jar</{n;s:.*<value>\(.*\)</value>.*:\1:p;}' | head -1)
            URL="$SNAPSHOTS/$VERSION/oshi-benchmark-$BUILD.jar"
          elif echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            URL="$RELEASES/$VERSION/oshi-benchmark-$VERSION.jar"
          else
            echo "::error::Unrecognized version '$VERSION'"
            exit 1
          fi
          echo "Resolved oshi-benchmark $VERSION: $URL"
          curl -fsSL -o oshi-benchmark.jar "$URL"
          # Releases before 7.8.1 published only the benchmark classes, not a runnable uber-jar
          if ! unzip -p oshi-benchmark.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: org.openjdk.jmh.Main'; then
            echo "::error::oshi-benchmark $VERSION is not a runnable JMH jar; use 7.8.1 or later"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  benchlinux:
    name: JMH benchmarks, Linux
    needs: resolve
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-latest
    env:
      JAR_URL: ${{ needs.resolve.outputs.url }}
      JMH_ARGS: ${{ inputs.native-args }}
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Download benchmark jar
        run: curl -fsSL -o oshi-benchmark.jar "$JAR_URL"
      # Longer settings than the VM jobs below: native runners give stable numbers, so this on-demand run
      # invests ~30 min for accuracy. -prof gc adds per-op allocation (bytes/op) for the memory columns.
      - name: Run JMH benchmarks
        run: java -jar oshi-benchmark.jar $JMH_ARGS ${BENCHMARKS:+"$BENCHMARKS"}
      # Retained-memory dimension of the reuse-vs-recreate trade-off (not a per-op JMH quantity)
      - name: Report monitoring footprint
        run: java --enable-native-access=ALL-UNNAMED -cp oshi-benchmark.jar oshi.benchmark.MonitoringFootprintReport

  benchmacos:
    name: JMH benchmarks, macOS
    needs: resolve
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    runs-on: macos-26
    env:
      JAR_URL: ${{ needs.resolve.outputs.url }}
      JMH_ARGS: ${{ inputs.native-args }}
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Download benchmark jar
        run: curl -fsSL -o oshi-benchmark.jar "$JAR_URL"
      - name: Run JMH benchmarks
        run: java -jar oshi-benchmark.jar $JMH_ARGS ${BENCHMARKS:+"$BENCHMARKS"}
      - name: Report monitoring footprint
        run: java --enable-native-access=ALL-UNNAMED -cp oshi-benchmark.jar oshi.benchmark.MonitoringFootprintReport

  benchwindows:
    name: JMH benchmarks, Windows
    needs: resolve
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-2025
    env:
      JAR_URL: ${{ needs.resolve.outputs.url }}
      JMH_ARGS: ${{ inputs.native-args }}
    defaults:
      run:
        # Git Bash, so the argument handling matches the other jobs
        shell: bash
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Download benchmark jar
        run: curl -fsSL -o oshi-benchmark.jar "$JAR_URL"
      - name: Run JMH benchmarks
        run: java -jar oshi-benchmark.jar $JMH_ARGS ${BENCHMARKS:+"$BENCHMARKS"}
      - name: Report monitoring footprint
        run: java --enable-native-access=ALL-UNNAMED -cp oshi-benchmark.jar oshi.benchmark.MonitoringFootprintReport

  # The VM jobs download the jar on the host runner; vmactions syncs the working directory into the VM,
  # and `envs` forwards the named variables.
  benchfreebsd:
    name: JMH benchmarks, FreeBSD
    needs: resolve
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'freebsd')
    runs-on: ubuntu-26.04
    env:
      JAR_URL: ${{ needs.resolve.outputs.url }}
      JMH_ARGS: ${{ inputs.vm-args }}
    steps:
      - name: Download benchmark jar
        run: curl -fsSL -o oshi-benchmark.jar "$JAR_URL"
      - name: Benchmark on FreeBSD
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1
        with:
          # Manual runs only: a cached base image would sit in the shared 10 GB Actions cache between
          # them, and restoring one is no faster than downloading it. See unix.yaml.
          disable-cache: true
          usesh: true
          envs: 'JMH_ARGS BENCHMARKS'
          prepare: |
            pkg install -y openjdk25
          run: |
            export JAVA_HOME=/usr/local/openjdk25
            export PATH=$JAVA_HOME/bin:$PATH
            java -jar oshi-benchmark.jar $JMH_ARGS ${BENCHMARKS:+"$BENCHMARKS"}

  benchopenbsd:
    name: JMH benchmarks, OpenBSD
    needs: resolve
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'openbsd')
    runs-on: ubuntu-26.04
    env:
      JAR_URL: ${{ needs.resolve.outputs.url }}
      JMH_ARGS: ${{ inputs.vm-args }}
    steps:
      - name: Download benchmark jar
        run: curl -fsSL -o oshi-benchmark.jar "$JAR_URL"
      - name: Benchmark on OpenBSD
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1
        with:
          # Manual runs only: a cached base image would sit in the shared 10 GB Actions cache between
          # them, and restoring one is no faster than downloading it. See unix.yaml.
          disable-cache: true
          release: "7.9"
          usesh: false
          mem: 4096
          envs: 'JMH_ARGS BENCHMARKS'
          prepare: |
            pkg_add jdk%25
          run: |
            export JAVA_HOME=/usr/local/jdk-25
            export PATH=$JAVA_HOME/bin:$PATH
            java -jar oshi-benchmark.jar $JMH_ARGS ${BENCHMARKS:+"$BENCHMARKS"}

  benchnetbsd:
    name: JMH benchmarks, NetBSD
    needs: resolve
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'netbsd')
    runs-on: ubuntu-26.04
    env:
      JAR_URL: ${{ needs.resolve.outputs.url }}
      JMH_ARGS: ${{ inputs.vm-args }}
    steps:
      - name: Download benchmark jar
        run: curl -fsSL -o oshi-benchmark.jar "$JAR_URL"
      - name: Benchmark on NetBSD
        uses: vmactions/netbsd-vm@5957cf330aef2e6ddc63c604364c99ce2e02b91d # v1
        with:
          disable-cache: true
          release: "10.1"
          usesh: true
          envs: 'JMH_ARGS BENCHMARKS'
          # The jar bundles no NetBSD libjnidispatch, so java-jna supplies it and the JNA column measures JNA's
          # native path, not the command-line fallback. The JDK 25 resolution matches unix.yaml's testnetbsdjna:
          # pkgsrc openjdk25 if it exists, else its bootstrap JDK.
          prepare: |
            pkg_add curl
            pkg_add java-jna
            if pkg_add openjdk25 2>/dev/null; then
              echo "using pkgsrc openjdk25"
            else
              BS=bootstrap-jdk-1.25.0.4.7-netbsd-9-amd64-20260908.tar.xz
              SHA=4587a19dea5edd24ccafb251221ee6177e788ae9ad6c0bf49be11ef900bbe7f75a0db77eb151edf12f8378aab8a7b9651043f31e98864317faf3ecb2533b34eb
              URL=https://cdn.netbsd.org/pub/pkgsrc/distfiles/LOCAL_PORTS/openjdk25/$BS
              curl -sSfLo /tmp/$BS "$URL" || { echo "FATAL: could not fetch $URL"; exit 1; }
              [ "$(cksum -a sha512 -n /tmp/$BS | cut -d' ' -f1)" = "$SHA" ] || { echo "FATAL: checksum mismatch for $BS"; exit 1; }
              mkdir -p /opt && tar -xJf /tmp/$BS -C /opt
              echo "using the pkgsrc bootstrap JDK"
            fi
          run: |
            if [ -d /usr/pkg/java/openjdk25 ]; then
              export JAVA_HOME=/usr/pkg/java/openjdk25
            else
              export JAVA_HOME=/opt/bootstrap
              # The bootstrap kit's RPATH points at the pkgsrc prefix it was built for
              export LD_LIBRARY_PATH=$JAVA_HOME/lib:$JAVA_HOME/lib/server
            fi
            export PATH=$JAVA_HOME/bin:$PATH
            mount -t procfs procfs /proc 2>/dev/null || true
            # Reaches the JMH JVM and its forks alike: points JNA at the pkgsrc libjnidispatch
            export JAVA_TOOL_OPTIONS="-Djna.boot.library.path=/usr/pkg/lib"
            java -jar oshi-benchmark.jar $JMH_ARGS ${BENCHMARKS:+"$BENCHMARKS"}

  benchaix:
    # SSH into the same cfarm AIX 7.3 box the regular Cfarm CI job uses. Same
    # JNA stable-load gymnastics: libjnidispatch.a gets pre-extracted to a
    # known cache path so the JVM can System.load() it directly. Without
    # this, OpenJ9 occasionally fails the per-PID jar-unpack with EBUSY.
    name: JMH benchmarks, AIX
    needs: resolve
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'aix')
    concurrency: aix_cfarm119
    runs-on: ubuntu-latest
    steps:
    - name: Benchmark on AIX
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
        JAR_URL: ${{ needs.resolve.outputs.url }}
        JMH_ARGS: ${{ inputs.vm-args }}
      with:
        host: cfarm119.cfarm.net
        username: oshi
        key: ${{ secrets.GCC_CI_KEY }}
        port: 22
        command_timeout: 30m
        envs: JAR_URL,JMH_ARGS,BENCHMARKS
        script: |
          set -e
          rm -fR ~/javashared*
          export JAVA_HOME=~/java/jdk-25.0.3+9
          export PATH=$PATH:/opt/freeware/bin
          WORK=/home/oshi/benchmark
          JAR=$WORK/oshi-benchmark.jar
          mkdir -p "$WORK"
          wget -nv -O "$JAR" "$JAR_URL"
          # Pre-extract libjnidispatch.a from the jar (see cfarm.yaml testaix for the long form)
          JNA_CACHE=/home/oshi/.cache/jna-benchmark
          rm -rf "$JNA_CACHE" && mkdir -p "$JNA_CACHE"
          (cd "$JNA_CACHE" && $JAVA_HOME/bin/jar xf "$JAR" com/sun/jna/aix-ppc64/libjnidispatch.a)
          mv "$JNA_CACHE/com/sun/jna/aix-ppc64/libjnidispatch.a" "$JNA_CACHE/libjnidispatch.a"
          rm -rf "$JNA_CACHE/com"
          ln -sf libjnidispatch.a "$JNA_CACHE/libjnidispatch.so"
          export _JAVA_OPTIONS="-Djna.boot.library.path=$JNA_CACHE"
          # Explicit $JAVA_HOME/bin/java: /opt/freeware/bin on AIX shadows
          # `java` with the OS-bundled Java 8, which doesn't recognize
          # --enable-native-access (added in JDK 17) — the flag the
          # @Fork(jvmArgsPrepend = "--enable-native-access=ALL-UNNAMED")
          # annotation passes to JMH forks. Launching via the JDK 25 binary
          # makes JMH set java.home to JDK 25 so forks inherit the same.
          $JAVA_HOME/bin/java -jar "$JAR" $JMH_ARGS ${BENCHMARKS:+"$BENCHMARKS"}

  benchopenindiana:
    name: JMH benchmarks, OpenIndiana
    needs: resolve
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'openindiana')
    runs-on: ubuntu-26.04
    env:
      JAR_URL: ${{ needs.resolve.outputs.url }}
      JMH_ARGS: ${{ inputs.vm-args }}
    steps:
      - name: Download benchmark jar
        run: curl -fsSL -o oshi-benchmark.jar "$JAR_URL"
      - name: Benchmark on OpenIndiana
        uses: vmactions/openindiana-vm@b0669479e0325a25198dc7ed2a4b6089e98f91b3 # v1
        with:
          # Manual runs only: a cached base image would sit in the shared 10 GB Actions cache between
          # them, and restoring one is no faster than downloading it. See unix.yaml.
          disable-cache: true
          # Bumped above the 8 GB used by the regular CI job because JMH forks
          # a fresh JVM per benchmark and illumos's native malloc pool is the
          # OOM bottleneck under back-to-back forks.
          mem: 12288
          envs: 'JMH_ARGS BENCHMARKS'
          prepare: |
            pkg install openjdk25
          run: |
            export JAVA_HOME=/usr/jdk/openjdk25
            export PATH=$JAVA_HOME/bin:$PATH
            export _JAVA_OPTIONS="-Xmx1g"
            java -jar oshi-benchmark.jar $JMH_ARGS ${BENCHMARKS:+"$BENCHMARKS"}
