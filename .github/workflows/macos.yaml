# Full CI matrix on all pushes to master branch
name: macOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'

permissions:
  contents: read

jobs:
  # Runs full project on multiple JDKs
  testmatrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Previous LTS, Current LTS, Current release
        java: [21, 25, 26]
        os: [macos-14, macos-15, macos-26]
        include:
          # Apple's licensing only permits macOS guests on Apple hardware, and GitHub satisfies it on Intel by
          # running physical machines: this runner reports itself as a Macmini6,2, where the Apple Silicon runners
          # report the VirtualMac2,1 of a Virtualization.framework guest. It is therefore the one hosted runner
          # where SystemInfoTest#testVirtualizationDetected cannot pass. Drop this flag with the runner itself.
          - java: 21
            os: 'macos-26-intel'
            bareMetal: 'true'
      fail-fast: false
    name: JDK ${{ matrix.java }}, ${{ matrix.os }}

    env:
      OSHI_BARE_METAL_RUNNER: ${{ matrix.bareMetal }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: 'maven'
      - name: Test with Maven
        if: ${{ !contains(matrix.java, '25') }}
        run: ./mvnw clean test -B
      - name: Test with Maven (aggregate coverage)
        if: contains(matrix.java, '25')
        run: ./mvnw clean test -Paggregate-coverage -B
      - name: Upload Coverage
        if: always() && contains(matrix.java, '25') && contains(matrix.os, 'macos-15')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml
          flags: macos
