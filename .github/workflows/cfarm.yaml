# CI on cfarm machines (AIX, Solaris SPARC, s390x Linux)
name: Cfarm CI

# AIX runs on every push to master: no other job covers it. Solaris SPARC and
# s390x run weekly, as their code rarely changes and the same OS is tested on
# every push elsewhere (OpenIndiana in unix.yaml, Linux in linux.yaml); what they
# add is the architecture, SPARC's JDK 17 and s390x's big-endian byte order.
# workflow_dispatch runs all three against the dispatched branch.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'
  schedule:
    - cron: "0 0 * * 6" # weekly, Saturday 00:00 UTC, alongside the Coverity scan and FFM audit

# Default-deny at the workflow level. All jobs SSH into cfarm hosts and never
# touch GITHUB_TOKEN, so no per-job grants are needed.
permissions: {}

# These boxes are a shared physical resource. GitHub's concurrency group keeps
# same-repo runs from overlapping, but it is per-repository, so a fork dispatch
# and an upstream run can still land on the same host. To make that survivable
# (rather than prevent it with an on-box lock) each run, before building:
#   * reaps stale JVMs left by a previously killed run (their open handles can
#     block git clean / mvn clean on the shared, possibly NFS-backed workspace),
#   * git clean -xffd to drop any leftover build output, and
#   * bounds the build wall-clock below the 25-minute ssh limit with `timeout`
#     so a hung/cancelled run tears down its own process tree instead of
#     orphaning a JVM for the next run to trip over.
# Those steps live in the per-host scripts in .github/cfarm/, which
# .github/cfarm/remote.sh runs over ssh.

# Host availability: cfarm machines go down for days at a time, and some drop
# ssh connections before authentication at random. remote.sh retries every
# connection that is refused, so the second only costs time. Each job first
# checks that its host takes ssh. A host that never answers on port 22 is
# reported as a warning and the job passes without testing, so an outage does
# not read as a failing build; its Codecov flag carries its last value forward.
# A host that answers but keeps refusing ssh fails the job, since that needs
# attention rather than patience.

jobs:
  # Tests the triggering ref on Solaris 11.4 SPARC: master weekly, or the
  # dispatched branch (possibly from a fork) on workflow_dispatch. Retries
  # once for the occasional junit-platform-maven-test flake.
  testsolaris_sparc:
    # The cfarm hosts are a shared physical resource and the concurrency group
    # above is per-repository, so it can't serialize an upstream push against a
    # fork's push run -- which fire together whenever a fork's master is synced.
    # Two runs then share ~/git/oshi and clobber each other's target/classes
    # (e.g. "package oshi.driver.common.X does not exist" on the loser). Only the
    # canonical repo runs on schedule; forks keep workflow_dispatch for branch tests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'oshi/oshi')
    name: Test JDK 17, Solaris SPARC
    concurrency: solaris_cfarm216
    runs-on: ubuntu-latest
    steps:
    # Checkout on the runner so codecov-action can read the git context (commit,
    # branch) for the report the Solaris box produces; the build itself runs remotely.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    # See "Host availability" at the top of this file.
    - name: Check cfarm216.cfarm.net is reachable
      id: reach
      env:
        GCC_CI_KEY: ${{ secrets.GCC_CI_KEY }}
      run: |
        rc=0
        .github/cfarm/remote.sh check cfarm216.cfarm.net || rc=$?
        echo "up=$([ $rc = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        if [ $rc = 1 ]; then
          echo "::error title=cfarm216.cfarm.net refused ssh::cfarm216.cfarm.net accepts connections but ssh kept failing; check the key and account."
          exit 1
        elif [ $rc = 2 ]; then
          echo "::warning title=cfarm216.cfarm.net unreachable::cfarm216.cfarm.net did not answer on port 22, so its tests were skipped."
          echo "cfarm216.cfarm.net did not answer on port 22, so its tests were skipped." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Test in Solaris SPARC
      if: steps.reach.outputs.up == 'true'
      env:
        GCC_CI_KEY: ${{ secrets.GCC_CI_KEY }}
        REPO_URL: https://github.com/${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
      run: .github/cfarm/remote.sh run cfarm216.cfarm.net .github/cfarm/solaris-sparc.sh
    # Pull the JDK 17 aggregate JaCoCo report (oshi-common + oshi-core, no FFM) off
    # the shared box and upload it to Codecov under the `solaris-sparc` flag. Runs on
    # test failure too, since JaCoCo still emits a report then.
    - name: Copy back Solaris SPARC coverage
      if: always() && steps.reach.outputs.up == 'true'
      env:
        GCC_CI_KEY: ${{ secrets.GCC_CI_KEY }}
      run: .github/cfarm/remote.sh fetch cfarm216.cfarm.net oshi/oshi-demo/target/site/jacoco-aggregate/jacoco.xml oshi-demo/target/site/jacoco-aggregate/jacoco.xml || echo "No Solaris SPARC coverage report to copy"
    - name: Upload Coverage
      if: always() && steps.reach.outputs.up == 'true'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: oshi-demo/target/site/jacoco-aggregate/jacoco.xml
        flags: solaris-sparc

  # Tests the triggering ref on AIX 7.3: master on push, or the dispatched
  # branch (possibly from a fork) on workflow_dispatch.
  # JNA's library is pre-extracted to ~/.cache/jna so the test JVM loads it
  # directly via System.load(); the JAR-unpack step is the flaky one on OpenJ9.
  testaix:
    # See testsolaris_sparc: skip fork push runs (they race the upstream run on
    # the shared box); forks keep workflow_dispatch for branch tests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository == 'oshi/oshi')
    name: Test JDK 25, AIX
    concurrency: aix_cfarm119
    runs-on: ubuntu-latest
    steps:
    # Checkout on the runner so codecov-action can read the git context (commit,
    # branch) for the report the AIX box produces; the build itself runs remotely.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    # See "Host availability" at the top of this file.
    - name: Check cfarm119.cfarm.net is reachable
      id: reach
      env:
        GCC_CI_KEY: ${{ secrets.GCC_CI_KEY }}
      run: |
        rc=0
        .github/cfarm/remote.sh check cfarm119.cfarm.net || rc=$?
        echo "up=$([ $rc = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        if [ $rc = 1 ]; then
          echo "::error title=cfarm119.cfarm.net refused ssh::cfarm119.cfarm.net accepts connections but ssh kept failing; check the key and account."
          exit 1
        elif [ $rc = 2 ]; then
          echo "::warning title=cfarm119.cfarm.net unreachable::cfarm119.cfarm.net did not answer on port 22, so its tests were skipped."
          echo "cfarm119.cfarm.net did not answer on port 22, so its tests were skipped." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Test in AIX
      if: steps.reach.outputs.up == 'true'
      env:
        GCC_CI_KEY: ${{ secrets.GCC_CI_KEY }}
        REPO_URL: https://github.com/${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
      run: .github/cfarm/remote.sh run cfarm119.cfarm.net .github/cfarm/aix.sh
    # Pull the aggregate JaCoCo report off the shared box (produced under JDK 25
    # so the FFM backend is included) and upload it to Codecov under the `aix`
    # flag. Runs on test failure too, since JaCoCo still emits a report then.
    - name: Copy back AIX coverage
      if: always() && steps.reach.outputs.up == 'true'
      env:
        GCC_CI_KEY: ${{ secrets.GCC_CI_KEY }}
      run: .github/cfarm/remote.sh fetch cfarm119.cfarm.net git/oshi/oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml || echo "No AIX coverage report to copy"
    - name: Upload Coverage
      if: always() && steps.reach.outputs.up == 'true'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: oshi-benchmark/target/site/jacoco-aggregate/jacoco.xml
        flags: aix

  # Tests the triggering ref on s390x Linux (Debian, big-endian): master weekly,
  # or the dispatched branch (possibly from a fork) on workflow_dispatch. No
  # coverage upload: s390x runs the same Linux code as the `linux` flag, so a flag
  # would add no lines. What this checks is that the tests, including the
  # JNA/FFM/native-free comparison tests, pass in big-endian byte order.
  tests390x:
    # See testsolaris_sparc.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'oshi/oshi')
    name: Test JDK 25, s390x Linux
    concurrency: s390x_cfarm191
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    # See "Host availability" at the top of this file.
    - name: Check cfarm191.cfarm.net is reachable
      id: reach
      env:
        GCC_CI_KEY: ${{ secrets.GCC_CI_KEY }}
      run: |
        rc=0
        .github/cfarm/remote.sh check cfarm191.cfarm.net || rc=$?
        echo "up=$([ $rc = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        if [ $rc = 1 ]; then
          echo "::error title=cfarm191.cfarm.net refused ssh::cfarm191.cfarm.net accepts connections but ssh kept failing; check the key and account."
          exit 1
        elif [ $rc = 2 ]; then
          echo "::warning title=cfarm191.cfarm.net unreachable::cfarm191.cfarm.net did not answer on port 22, so its tests were skipped."
          echo "cfarm191.cfarm.net did not answer on port 22, so its tests were skipped." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Test in s390x Linux
      if: steps.reach.outputs.up == 'true'
      env:
        GCC_CI_KEY: ${{ secrets.GCC_CI_KEY }}
        REPO_URL: https://github.com/${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
      run: .github/cfarm/remote.sh run cfarm191.cfarm.net .github/cfarm/s390x.sh
