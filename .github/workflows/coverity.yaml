name: Coverity Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6" # weekly, Saturday 00:00 UTC (Coverity Scan throttles frequent runs; trigger manually after major changes)

permissions:
  contents: read

jobs:
  build:
    if: github.repository_owner == 'oshi'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          cache: maven
          # cov-build 2024.12.1 (the version the free Coverity Scan tier serves) cannot capture JDK 25 bytecode, so
          # the scan runs on JDK 23 and lowers the FFM/benchmark compile target to 23 via -Doshi.ffm.release. Revert
          # to 25 (and drop -Pcoverity/-Doshi.ffm.release below) once Coverity Scan ships a JDK 25-capable build tool.
          java-version: 23
          distribution: temurin

      - name: Analyze with Coverity
        shell: bash
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          COVERITY_PROJECT: "oshi/oshi"
        run: |
          set -euo pipefail

          # Download Coverity tool (Linux 64-bit) for this project
          wget -q https://scan.coverity.com/download/linux64 \
            --post-data "token=${COVERITY_TOKEN}&project=${COVERITY_PROJECT}" \
            -O coverity_tool.tgz

          tar -xzf coverity_tool.tgz

          # The directory name carries the served build-tool version. When Coverity Scan bumps to a JDK 25-capable
          # tool, this is the signal to drop the JDK 23 / -Doshi.ffm.release workaround and scan straight on Java 25.
          TOOL_DIR="$(echo cov-analysis-linux64-*/ | head -n 1)"
          echo "Using Coverity tool dir: ${TOOL_DIR}"

          # Configure Java capture
          "${TOOL_DIR}bin/cov-configure" --java

          # IMPORTANT: clean build under cov-build to ensure full capture.
          # -Pcoverity pulls the FFM and benchmark modules into the reactor on this pre-25 JDK, and
          # -Doshi.ffm.release=23 lowers their compile target so cov-build 2024.12.1 can capture them.
          rm -rf cov-int

          "${TOOL_DIR}bin/cov-build" --dir cov-int \
            ./mvnw -B -DskipTests=true -Pcoverity -Doshi.ffm.release=23 \
            clean compile

          # Package results for upload
          tar -czf oshi.tgz cov-int

          # Upload to Coverity Scan
          curl --fail --silent --show-error \
            --form token="${COVERITY_TOKEN}" \
            --form email="${EMAIL}" \
            --form file=@oshi.tgz \
            --form version="oshi/coverity_scan" \
            --form description="Oshi Coverity Scan" \
            "https://scan.coverity.com/builds?project=oshi%2Foshi"
