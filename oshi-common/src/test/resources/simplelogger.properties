# see http://www.slf4j.org/api/org/slf4j/impl/SimpleLogger.html
#org.slf4j.simpleLogger.logFile=target/unit-tests.log
org.slf4j.simpleLogger.defaultLogLevel=INFO
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# Keep real errors visible during tests (e.g. sysctl/system-read failures at ERROR), but silence
# loggers whose error output is expected test noise. Keys are the *emitting* logger name: ExceptionUtil
# logs via the caller's logger (its test noise is under the test class); ParseUtil logs under its own name.
org.slf4j.simpleLogger.log.oshi.util=ERROR
org.slf4j.simpleLogger.log.oshi.util.ParseUtil=OFF
org.slf4j.simpleLogger.log.oshi.util.ExceptionUtilTest=OFF
# ExceptionUtil's own logger is the exception to the rule above: the overloads taking no logger fall back
# to it, so the deliberate signature-mismatch tests print an ERROR and a stack trace under this name on
# every platform. Nothing else in oshi-common can emit here -- that logger fires only on a
# WrongMethodTypeException, which needs a native binding, and oshi-common has none. A real one in
# oshi-core or oshi-core-ffm still logs loudly: their test configuration does not set this key. The
# rethrow, not the log line, is what fails the build for a genuine defect.
org.slf4j.simpleLogger.log.oshi.util.ExceptionUtil=OFF

# Silence the WARN-level fallback notices from the three classes named below, keeping ERROR visible. All
# three are tested with the native boundary overridden, so nothing here reaches the host and the warnings are
# produced on every platform -- a Windows CI log carries the macOS and Linux ones too. Each warning is the correct
# production output for the degraded path the test asks for: an unreadable sysfs cpu directory, an IOReport
# subscription that returns no sampler, a tick array longer than the logical processor count. Gating the tests by
# OS would delete them from seven of the eight jobs and still print the warning on the eighth, so the level is
# lowered here instead. These keys belong to oshi-common alone; oshi-core and oshi-core-ffm run the same classes
# against the real platform, where a warning means something, and their configuration leaves it at WARN.
org.slf4j.simpleLogger.log.oshi.hardware.common.platform.linux.LinuxCentralProcessor=ERROR
org.slf4j.simpleLogger.log.oshi.hardware.common.platform.mac.MacCentralProcessor=ERROR
org.slf4j.simpleLogger.log.oshi.hardware.common.platform.mac.MacGpuStats=ERROR
