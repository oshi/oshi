# MAC address OUIs corresponding to known VMs, containers, and cloud platforms.
#
# Entries whose first octet has the locally-administered bit set (02, 06, 42, 52, FA) are not
# registered allocations. Most are deterministic defaults a platform assigns, but the AWS prefixes
# are observed samples of a per-interface random assignment, so they detect only a subset of
# instances. The GCP prefix is built from the internal IPv4 address, so it matches only the
# standard 10.x.x.x range.

# VMware
00\:50\:56=VMware vCenter/vSphere
00\:0C\:29=VMware ESXi or Workstation
00\:05\:69=VMware
00\:1C\:14=VMware

# Microsoft
00\:03\:FF=Microsoft Hyper-V
00\:15\:5D=Microsoft Hyper-V

# Xen and derivatives
00\:16\:3E=Xen, Oracle VM, or LXC

# QEMU and KVM
52\:54\:00=QEMU/KVM
00\:1A\:4A=QEMU

# Other hypervisors
00\:1C\:42=Parallels Desktop
08\:00\:27=VirtualBox
00\:0F\:4B=Virtual Iron

# Containers
02\:42\:AC=Docker Container

# Cloud platforms
FA\:16\:3E=OpenStack Neutron
02\:00\:17=oVirt/RHEV
02\:81\:6F=Amazon Web Services
06\:05\:B0=Amazon Web Services
06\:A2\:90=Amazon Web Services
42\:01\:0A=Google Cloud Platform
