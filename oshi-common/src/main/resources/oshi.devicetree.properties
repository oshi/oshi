# Devicetree vendor prefixes and the manufacturer names they stand for.
#
# A board's first "compatible" string is "vendor,board"; the prefixes are registered in the Linux
# kernel's Documentation/devicetree/bindings/vendor-prefixes.yaml, which gives each one's full
# name. This file names the board and SoC makers most often seen running Linux; a prefix that is
# not listed is reported as it stands.

