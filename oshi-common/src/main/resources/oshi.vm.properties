# Signatures identifying a virtualized or containerized environment.
# MAC address OUIs are in oshi.vmmacaddr.properties.
#
# Keys are matched case-sensitively. A space in a key must be escaped with a backslash, because
# Properties ends a key at the first unescaped space, equals sign, or colon.

# Hypervisor CPUID vendor string, matched exactly against the processor identifier's vendor.
# These are CPUID leaf 0x40000000 signatures. OSHI currently reports the leaf 0 CPU vendor on
# Linux, macOS and Windows, where a guest reports its physical CPU vendor instead, so this table
# fires only where a platform surfaces the hypervisor string. It is kept because it is correct,
# costs one lookup, and is ready if a platform starts reporting the hypervisor leaf.
cpuid.bhyve\ bhyve=bhyve
cpuid.KVMKVMKVM=KVM
cpuid.TCGTCGTCGTCG=QEMU
cpuid.Microsoft\ Hv=Microsoft Hyper-V
cpuid.VMwareVMware=VMware
cpuid.XenVMMXenVMM=Xen HVM
cpuid.ACRNACRNACRN=Project ACRN
cpuid.QNXQVMBSQG=QNX Hypervisor
# Endianness mismatch of "prl hyperv "
cpuid.lrpepyh\ vr=Parallels

# Computer system signature, matched as a substring of the manufacturer and model joined by a
# space. The manufacturer is part of the haystack because several platforms put their name only
# there: a QEMU guest reports manufacturer "QEMU" with model "Standard PC (i440FX + PIIX, 1996)",
# and VirtualBox reports manufacturer "innotek GmbH". Longer keys are tried first, so a more
# specific signature wins over one contained in it, and a key may span both fields.
model.Microsoft\ Corporation\ Virtual\ Machine=Microsoft Hyper-V
model.Microsoft\ Virtual\ PC=Microsoft Virtual PC
model.Linux\ Containers=Linux Containers
model.FreeBSD\ Jail=FreeBSD Jail
model.linux-vserver=Linux-VServer
model.Linux\ lguest=lguest
model.innotek\ GmbH=VirtualBox
model.VirtualBox=VirtualBox
# Apple Virtualization.framework guests report a VirtualMacN,M model identifier
model.VirtualMac=Apple Virtualization
model.Linux\ KVM=KVM
model.Parallels=Parallels
model.OpenVZ=OpenVZ
model.VMware=VMware
model.VMWare=VMware
model.Bochs=Bochs
model.QEMU=QEMU
model.Qemu=QEMU
model.Xen=Xen
model.LXC=LXC
